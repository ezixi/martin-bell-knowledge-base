[tool.black]
line-length = 110
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
  | \.env
  | \.flake8
)/
'''

[tool.isort]
profile = "black"
line_length = 110
src_paths = ["src"]


[tool.pymarkdown]

# Do not allow any files starting with `draft-`
system.exclude_path = "draft-*.md"

extensions.markdown-tables.enabled = true
extensions.front-matter.enabled = true
extensions.front-matter.allow_blank_lines = true
plugins.MD013.enabled = false
plugins.MD025.front_matter_title = "_title"
